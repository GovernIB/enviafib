# Directori on es guardaran tots els fitxers
es.caib.enviafib.filesdirectory=c:\\enviafibfiles\\enviafibfiles

# Url per enviament de peticions a PortaFIB
es.caib.enviafib.portafib.apifirmaasync.url=https://PORTAFIBSERVER/portafib/common/rest/apifirmaasyncsimple/v2/
es.caib.enviafib.portafib.apifirmaasync.username=username 
es.caib.enviafib.portafib.apifirmaasync.password=password
es.caib.enviafib.portafib.apifirmaasync.profile.pades=profile-pades-portafib


# Url per les firmes Síncrones PortaFIB 
es.caib.enviafib.portafib.apifirmaweb.url=https://PORTAFIBSERVER/portafib/common/rest/apifirmawebsimple/v1/
es.caib.enviafib.portafib.apifirmaweb.username=username
es.caib.enviafib.portafib.apifirmaweb.password=password


# Url a API de Flux de Firmes de PortaFIB
es.caib.enviafib.portafib.apiflow.url=https://PORTAFIBSERVER/portafib/common/rest/apiflowtemplatesimple/v1/
es.caib.enviafib.portafib.apiflow.username=username
es.caib.enviafib.portafib.apiflow.password=password


# PLUGIN ESTRUCTURA ORGANITZATIVA - LDAP CAIB
es.caib.enviafib.pluginsib.estructuraorganitzativa.ldapcaib.ldap.host_url=host_url
es.caib.enviafib.pluginsib.estructuraorganitzativa.ldapcaib.dir3host=dir3host
es.caib.enviafib.pluginsib.estructuraorganitzativa.ldapcaib.ldap.security_principal=security_principal
es.caib.enviafib.pluginsib.estructuraorganitzativa.ldapcaib.ldap.security_credentials=security_credentials


# EXECUCIÓ DEL SCHEDULER PER TANCAR EXPEDIENTS
es.caib.enviafib.arxiu.tancarexpedient.scheduler.hora=4:30



#  ======== PLUGIN USER-INFORMATION - KEYCLOAK =======

es.caib.enviafib.userinformationplugin=org.fundaciobit.pluginsib.userinformation.keycloak.KeyCloakUserInformationPlugin
es.caib.enviafib.pluginsib.userinformation.keycloak.serverurl=http://localhost:18080/auth/
es.caib.enviafib.pluginsib.userinformation.keycloak.realm=GOIB
es.caib.enviafib.pluginsib.userinformation.keycloak.client_id=goib-ws
es.caib.enviafib.pluginsib.userinformation.keycloak.password_secret=8103f9ff-6150-45fe-8d4a-76ad061f204e
es.caib.enviafib.pluginsib.userinformation.keycloak.client_id_for_user_autentication=goib-default

# Mappings. Mapejos entre valors de Attibutes de un usuari i els valors de UserInfo de PluginUserInformation
# Clau:  username, administrationID, name, surname1, surname2, email, language,
#        phoneNumber, password,  address, company, website o gender( -1: unknown or undefined, 0 female, 1 male)
# Valor:  Atribut definit dins "Attributes" de l'usuari Keycloak
es.caib.enviafib.pluginsib.userinformation.keycloak.mapping.administrationID=nif
#es.caib.enviafib.pluginsib.userinformation.keycloak.mapping.companyDepartment=departmentNumber
#es.caib.enviafib.pluginsib.userinformation.keycloak.mapping.companyArea=areaNumber
#es.caib.enviafib.pluginsib..pluginsib.userinformation.keycloak.mapping.company=departmentNumber
#es.caib.enviafib.pluginsib..pluginsib.userinformation.keycloak.mapping.surname1=sn1
#es.caib.enviafib.pluginsib..pluginsib.userinformation.keycloak.mapping.surname2=sn2

es.caib.enviafib.pluginsib.userinformation.keycloak.mapping.dir3=dir3
es.caib.enviafib.pluginsib.userinformation.keycloak.mapping.dir3Parent=dir3pare

# Només en entorns CAIB. S'utilitzen els valors de DIR3 i DIR3PARENT per 
# assignar valors a Area (companyArea) i Departament (companyDepartment)
# IMPORTANT: Si aquesta propietat està definida i dir3 o dir3Parent valen null llavors llançarà un error 
# IMPORTANT: Si aquesta propietat està definida i companyArea o companyDepartment valen diferent de null
# llavors llançarà un error
# El valor d'aquesta propietat ha de ser el DIR3 arrel de l'organització
# es.caib.enviafib.pluginsib.userinformation.keycloak.useDir3InfoToGenerateAreaDepartment=A04003003


# Per depuració
es.caib.enviafib.pluginsib.userinformation.keycloak.debug=true



